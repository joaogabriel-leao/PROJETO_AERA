spring.application.name=backend

# ============================================================
# PROFILES (ambientes)
# ============================================================
# Este arquivo guarda apenas a configuracao COMUM a todos os ambientes.
# O que varia entre desenvolvimento e producao fica em:
#   - application-dev.properties  (desenvolvimento: liberado)
#   - application-prod.properties (producao: travado/seguro)
#
# O profile "dev" e o padrao: ao rodar sem indicar nada, a aplicacao
# sobe em modo desenvolvimento. Para producao, ative o profile "prod"
# (ver instrucoes no README.md).
spring.profiles.active=dev

# ------------------------------------------------------------
# Servidor (comum aos dois ambientes)
# ------------------------------------------------------------
# O frontend (Vite) espera a API em http://localhost:8080/api
# (ver VITE_API_BASE_URL no frontend/.env.example)
server.port=8080
server.servlet.context-path=/api

# ------------------------------------------------------------
# Origens permitidas pelo CORS (lidas pelo CorsConfig)
# ------------------------------------------------------------
# Valor padrao: o frontend local em desenvolvimento. Em producao,
# sobrescreva em application-prod.properties ou via variavel de ambiente.
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
