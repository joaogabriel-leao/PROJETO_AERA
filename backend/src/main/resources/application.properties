spring.application.name=backend

# O frontend (Vite) espera a API em http://localhost:8080/api
# (ver VITE_API_BASE_URL no frontend/.env.example)
server.port=8080
server.servlet.context-path=/api

# ============================================================
# BANCO DE DADOS - AINDA NAO DEFINIDO PELO GRUPO
# ============================================================
# Enquanto o Spring Data JPA estiver comentado no pom.xml, nao e
# necessaria nenhuma configuracao de datasource aqui.
#
# Quando o banco for escolhido, descomente o JPA no pom.xml,
# adicione o driver e configure as propriedades abaixo. Exemplo H2:
#
# spring.datasource.url=jdbc:h2:mem:aera
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.hibernate.ddl-auto=update
# spring.h2.console.enabled=true
# ============================================================
