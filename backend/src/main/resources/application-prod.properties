# ============================================================
# PROFILE: prod (PRODUCAO)
# ============================================================
# Ambiente travado e seguro, para quando o sistema for publicado.
# Ativar com: --spring.profiles.active=prod (ver README.md).
#
# Observacao: as credenciais do banco NAO ficam no codigo. Sao lidas de
# variaveis de ambiente (DB_URL, DB_USERNAME, DB_PASSWORD), definidas no
# servidor de producao. Assim, segredos nunca vao para o repositorio.
# ============================================================

# ------------------------------------------------------------
# Banco de dados: definido por variaveis de ambiente
# ------------------------------------------------------------
# O grupo ainda nao escolheu o banco definitivo. Quando escolher
# (PostgreSQL/MySQL), basta adicionar o driver no pom.xml e definir as
# variaveis de ambiente abaixo no servidor. Enquanto isso, ha um H2 como
# fallback apenas para a aplicacao conseguir subir.
spring.datasource.url=${DB_URL:jdbc:h2:mem:aera;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# ddl-auto em producao:
# IDEAL (futuro): "validate" — o Hibernate apenas confere o schema, sem
# alterar nada. Porem "validate" exige que as tabelas JA existam (criadas
# por migrations, ex.: Flyway/Liquibase, ou por um banco pre-configurado).
# COMO O GRUPO AINDA NAO TEM BANCO DEFINITIVO NEM MIGRATIONS, usamos "update"
# por enquanto, para a aplicacao conseguir subir. Quando o grupo adotar um
# banco real + migrations, TROQUE para "validate" (mais seguro).
spring.jpa.hibernate.ddl-auto=update

# Logs de SQL DESLIGADOS (nao vazar dados sensiveis nos logs).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ------------------------------------------------------------
# Seguranca
# ------------------------------------------------------------
# Console do H2 DESLIGADO (nunca expor acesso direto ao banco em producao).
spring.h2.console.enabled=false

# Nao expor detalhes de erro/stack trace nas respostas HTTP.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Origens de CORS em producao: devem ser informadas via variavel de ambiente
# APP_CORS_ALLOWED_ORIGINS (ex.: https://aera.com.br). O valor abaixo e so
# um placeholder seguro.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
