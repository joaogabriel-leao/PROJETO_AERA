# ============================================================
# PROFILE: dev (DESENVOLVIMENTO)
# ============================================================
# Ambiente liberado, pensado para facilitar o desenvolvimento local.
# NUNCA use estas configuracoes em producao.
#
# Ativado por padrao (ver spring.profiles.active no application.properties).
# ============================================================

# ------------------------------------------------------------
# Banco de dados: H2 em memoria
# ------------------------------------------------------------
# Banco "aera" em memoria. DB_CLOSE_DELAY=-1 o mantem vivo enquanto a
# aplicacao estiver no ar. Os dados somem ao reiniciar (esperado em dev).
spring.datasource.url=jdbc:h2:mem:aera;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria/atualiza as tabelas a partir das entidades (@Entity).
spring.jpa.hibernate.ddl-auto=update

# Mostra o SQL gerado no console (util para aprender/depurar em dev).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------
# Console web do H2 (LIBERADO apenas em dev)
# ------------------------------------------------------------
# Permite inspecionar os dados pelo navegador em:
#   http://localhost:8080/api/h2-console
# (JDBC URL: jdbc:h2:mem:aera | usuario: sa | senha: em branco)
# Em producao este console fica DESLIGADO por seguranca.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
