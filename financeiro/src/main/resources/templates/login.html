<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | AERA</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<main class="center"><section class="card"><h1>AERA Financeiro</h1><p>Entre com sua conta para continuar.</p><p th:if="${param.error}" class="error">Usuário ou senha inválidos.</p><p th:if="${param.logout}" class="success">Sessão encerrada.</p>
<form th:action="@{/login}" method="post"><label>Usuário<input name="username" required autocomplete="username"></label><label>Senha<input type="password" name="password" required autocomplete="current-password"></label><button type="submit">Entrar</button></form></section></main>
</body></html>
