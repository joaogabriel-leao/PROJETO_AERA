<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurações | AERA</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<header><strong>AERA Financeiro</strong><nav><a th:href="@{/movimentacoes}">Movimentações</a></nav></header><main><h1>Configurações</h1><p th:if="${erro}" class="error" th:text="${erro}"></p><div class="columns">
<section class="card"><h2>Contas</h2><ul><li th:each="c : ${contas}" th:text="${c.nome}"></li></ul><form th:action="@{/config/contas}" method="post"><label>Nome da conta<input name="nome" maxlength="100" required placeholder="Ex.: Conta corrente BB"></label><button>Adicionar conta</button></form></section>
<section class="card"><h2>Categorias</h2><ul><li th:each="c : ${categorias}" th:text="${c.nome}"></li></ul><form th:action="@{/config/categorias}" method="post"><label>Categoria<input name="nome" maxlength="100" required placeholder="Ex.: Energia elétrica"></label><button>Adicionar categoria</button></form></section></div></main></body></html>
