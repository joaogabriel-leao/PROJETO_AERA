<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movimentações | AERA</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<header><strong>AERA Financeiro</strong><nav><a th:href="@{/movimentacoes}">Movimentações</a><a th:href="@{/config}">Configurações (admin)</a><form th:action="@{/logout}" method="post"><button class="secondary">Sair</button></form></nav></header>
<main><div class="actions"><h1>Movimentações financeiras</h1><a class="button" th:href="@{/movimentacoes/nova}">Nova movimentação</a></div><p th:if="${sucesso}" th:text="${sucesso}" class="success"></p>
<div class="card"><table><thead><tr><th>Data</th><th>Tipo</th><th>Conta</th><th>Categoria</th><th>Descrição</th><th>Valor (R$)</th><th>Registrado por</th></tr></thead>
<tbody><tr th:each="m : ${movimentacoes}"><td th:text="${#temporals.format(m.dataMovimentacao, 'dd/MM/yyyy')}"></td><td th:text="${m.tipo}"></td><td th:text="${m.conta.nome}"></td><td th:text="${m.categoria.nome}"></td><td th:text="${m.descricao}"></td><td th:text="${m.valor}"></td><td th:text="${m.usuario.username}"></td></tr><tr th:if="${#lists.isEmpty(movimentacoes)}"><td colspan="7">Nenhuma movimentação cadastrada.</td></tr></tbody></table></div></main></body></html>
